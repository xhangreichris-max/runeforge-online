
name: Build RuneForge Pages

on:
  push:
    branches:
      - main
    paths:
      - 'pages-config.json'
      - 'template.html'
      - 'pages-config-de.json'
      - 'template-de.html'
      - 'build.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script
        run: |
          echo "=== Running build.py --all ==="
          python build.py --all
          echo "=== English files generated ==="
          ls -la *.html
          echo "=== German files generated ==="
          ls -la de/*.html

      - name: Check git status
        run: |
          echo "=== Git status ==="
          git status
          echo "=== New/modified files ==="
          git diff --name-only
          git ls-files --others --exclude-standard

      - name: Commit and push generated pages
        run: |
          git config --global user.name "RuneForge Builder"
          git config --global user.email "builder@runeforge.online"
          git add *.html tools.js sitemap.xml de/*.html tools-de.js sitemap-de.xml
          echo "=== Staged files ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "Nothing to commit — pages already up to date"
          else
            git commit -m "Auto-build: generated English + German pages [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "=== Push successful ==="
          fi
